[project]
name = "ins-c2-006"
version = "0.1.0"
description = "InsuranceApplicationDataValidationAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework ships untyped: its classes resolve to Any, so subclassing them
# trips disallow_subclassing_any under strict. Relax exactly that flag and skip
# type-following into the framework/shared packages.
disallow_subclassing_any = false
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true
